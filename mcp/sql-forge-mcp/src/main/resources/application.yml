spring:
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: sql-forge-mcp-server
        version: 0.0.1
    dashscope:
      api-key: ${DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen3.5-plus

logging:
  pattern:
    console:
  file:
    name: ./mcp/sql-forge-mcp-server.log

# sql-forge 配置
sql-forge:
  # API 基础地址（指向 sql-forge 服务）
  api:
    url: http://localhost:8081
    executor: database
  # 数据库方言：MYSQL, POSTGRESQL, ORACLE, SQL_SERVER, H2, SQLITE, STANDARD_SQL
  dialect: MYSQL
